name: promptlab-local

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      POSTGRES_DB: promptlab
      POSTGRES_USER: promptlab
      POSTGRES_PASSWORD: promptlab
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptlab -d promptlab"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - promptlab-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - promptlab-redis:/data

volumes:
  promptlab-postgres:
  promptlab-redis:
